name: MSRV

on:
  push:
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout xezim-core
        run: |
          git clone https://github.com/opensource-elearning/xezim-core.git ../xezim-core
          echo "CORE_SHA=$(git -C ../xezim-core rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargoreg-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-msrv-cargoreg-

      # See the note in test.yml: Cargo.lock is gitignored, so the old key
      # hashed to nothing and one shared `target/` was reused across every
      # commit and every ../xezim-core revision.
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-msrv-target-${{ hashFiles('**/Cargo.toml') }}-${{ env.CORE_SHA }}

      - name: Install cargo-msrv
        run: cargo install cargo-msrv --locked

      - name: cargo msrv verify
        run: cargo msrv verify
