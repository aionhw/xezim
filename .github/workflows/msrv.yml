name: MSRV

on:
  push:
  pull_request:

env:
  CC: clang
  CXX: clang++
  AR: llvm-ar
  RANLIB: llvm-ranlib
  CARGO_BUILD_JOBS: 1

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm

      - name: Read the pinned toolchain and core revision
        run: |
          TASK_MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          CORE_SHA=$(sed -nE 's/^xezim-core = .*rev = "([0-9a-f]{40})".*/\1/p' Cargo.toml)
          test -n "$TASK_MSRV"
          test -n "$CORE_SHA"
          echo "MSRV=$TASK_MSRV" >> "$GITHUB_ENV"
          echo "CORE_SHA=$CORE_SHA" >> "$GITHUB_ENV"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargoreg-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-msrv-cargoreg-

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-msrv-${{ env.MSRV }}-target-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml') }}-${{ env.CORE_SHA }}

      - name: Check default targets at MSRV
        run: cargo +"$MSRV" check --all-targets

      - name: Check optional features at MSRV
        run: cargo +"$MSRV" check --all-targets --features jit
