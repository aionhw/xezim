name: CI

on:
  push:
  pull_request:

env:
  CC: clang
  CXX: clang++
  AR: llvm-ar
  RANLIB: llvm-ranlib
  # Surface a panic location instead of just "exit code 101" in the job log.
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 1
  RUST_TEST_THREADS: 2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm

      # xezim-core is a git dependency in Cargo.toml (cargo clones it), but
      # Cargo.lock is gitignored so it tracks a moving main — the build cache
      # key still needs the core commit to avoid reusing a tree built against
      # a different core.
      - name: Resolve xezim-core HEAD
        run: |
          echo "CORE_SHA=$(git ls-remote https://github.com/aionhw/xezim-core.git refs/heads/main | cut -f1)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Registry/git downloads are content-addressed, so sharing them across
      # commits is safe and a loose key is what we want.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargoreg-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-cargoreg-

      # `target/` is NOT safe to share the same way. Cargo.lock is gitignored,
      # so the old `hashFiles('**/Cargo.lock')` expanded to an EMPTY hash and
      # every commit restored one shared `target/` — one built against whatever
      # ../xezim-core happened to be at the time, since that repo is cloned from
      # a moving main and no cache key ever covered it. Key on the manifests AND
      # the core commit, with no restore-keys, so a tree built against a
      # different core is never reused.
      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml') }}-${{ env.CORE_SHA }}

      - name: Coverage analyzer tests
        run: python3 scripts/test_analyze_test_coverage.py

      - name: cargo test (no features)
        run: cargo test --no-fail-fast

      # Keep two native-backend smoke tests in CI. The full JIT regression
      # suite remains available manually with cargo test --features jit.
      - name: JIT smoke tests (2 tests)
        if: always()
        run: >-
          cargo test --features jit --test perf --test scheduling --no-fail-fast -- --exact
          cmp_branch_const::constant_comparison_branches_execute_on_each_native_backend
          next_twelve_finish_barrier_371::native_finish_stops_following_assignment

      # Imported DPI tasks on the nested-scheduler fallback, the path a
      # platform without fibers takes (#290).
      - name: DPI tests on the nested-scheduler fallback
        if: always()
        env:
          XEZIM_DPI_FIBERS: "0"
        run: cargo test --test strings --no-fail-fast -- dpi_export_task_waits dpi_semantics dpi_export_types

  # The DPI groups on macOS arm64: the fibers there are aarch64 and the
  # trampoline links for Mach-O (#290). Only the DPI tests, not the suite.
  dpi-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargoreg-${{ hashFiles('**/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-cargoreg-

      - name: DPI tests
        run: cargo test --test strings --no-fail-fast -- dpi_export_task_waits dpi_semantics dpi_export_types

      - name: DPI tests on the nested-scheduler fallback
        if: always()
        env:
          XEZIM_DPI_FIBERS: "0"
        run: cargo test --test strings --no-fail-fast -- dpi_export_task_waits dpi_semantics dpi_export_types
